name: codeql
on:
  push:
    branches: [main, feature/predictive-diagnostics-lab]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
