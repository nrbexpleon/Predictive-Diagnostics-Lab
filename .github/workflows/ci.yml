name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q predictive_diagnostics tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Demo
        run: python -m predictive_diagnostics.cli --vehicles 100 --samples 40
